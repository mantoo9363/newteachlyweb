<section class="faq-section">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Help Center</span>
      <h2 class="section-title">Got <span>Questions?</span> We've Got Answers</h2>
      <p class="section-desc">Explore the most common questions about Teachly and how we're transforming education for everyone.</p>
    </div>

    <div class="faq-grid">
      @for (faq of faqs(); track $index; let i = $index) {
        <div class="faq-item" [class.active]="faq.isOpen" (click)="toggleFaq(i)">
          <div class="faq-question">
            <h3>{{ faq.question }}</h3>
            <div class="toggle-icon">
              <i class="fas" [class.fa-chevron-down]="!faq.isOpen" [class.fa-chevron-up]="faq.isOpen"></i>
            </div>
          </div>
          <div class="faq-answer">
            <div class="answer-content">
              <p>{{ faq.answer }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
